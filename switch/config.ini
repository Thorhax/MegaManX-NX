# Nintendo Switch defaults. This file is written beside MegaManX.nro on first
# run; edit that copy (sd:/switch/MegaManX/config.ini) to change settings.
#
# Controller: B jump, Y shoot, R dash, L / A switch weapons (SNES L / R),
# X = SNES X, - = Select, + = Start.
#   - + A        save-state browser (Select + SNES R)
#   - + R-stick  rewind (press the right stick in)
[General]
Autosave = 0
DisableFrameDelay = 0
# Skip the launcher and boot straight to the game (the launcher's "Skip Launcher
# on Boot" toggle sets this). Run with --launcher, or set this back to 0, to show it.
SkipLauncher = 0
# Oracle-build only. Leave at false for MMX investigations: freeze repros
# load a save state to reach the scene, but the snes9x oracle starts from
# boot and cannot follow save-state loads, so any recomp-vs-oracle
# comparison diffs two unrelated game moments. A prior session burned
# real time chasing false "divergences" that turned out to be content
# mismatch. Re-enabling this without first adding save-state-aware
# oracle (or input-record/replay parity) is NOT a fix — see header doc
# in snes_oracle_backend.h and the startup stderr warning.
EnableSnes9xOracle = false

[Graphics]
WindowSize = Auto
Fullscreen = 1
WindowScale = 3
NewRenderer = 1
# Switch builds present through SDL_Renderer only (no desktop OpenGL presenter).
OutputMethod = SDL
IgnoreAspectRatio = 0
DisplayAspect = 4:3
LinearFiltering = 0
NoSpriteLimits = 1
Widescreen = 0
Shader =

[Sound]
EnableAudio = 1
AudioFreq = 32040
AudioChannels = 2
AudioSamples = 1024

[KeyMap]
# Every hotkey the game responds to is listed here and rebindable.
# Prefix with Shift+/Ctrl+/Alt+ as needed; SDL key names (F1, Tab, p, ...).
# Leave a value empty to unbind the hotkey entirely (e.g. "DisplayPerf =").
Fullscreen = Alt+Return
Reset = Ctrl+r
Pause = Shift+p
PauseDimmed = p
Turbo = Tab
WindowBigger = Ctrl+Up
WindowSmaller = Ctrl+Down
VolumeUp = Keypad +
VolumeDown = Keypad -
# Toggle the FPS/perf readout (in-window or title bar).
DisplayPerf = f
# Switch between the old and new PPU renderer at runtime.
ToggleRenderer = r
# Toggle true PPU widescreen rendering at runtime.
ToggleWidescreen = Alt+w
Load =      F1,     F2,     F3,     F4,     F5,     F6,    F11,    F12,     F9,     F10
Save = Shift+F1,Shift+F2,Shift+F3,Shift+F4,Shift+F5,Shift+F6,Shift+F7,Shift+F8,Shift+F9,Shift+F10

SaveStateMenu = F7
Rewind = F8
# Reopen the launcher mid-game (settings, controls, mods). The game waits
# behind it; RESUME carries on from the same moment.
OpenLauncher = Ctrl+l

[GamepadMap]
EnableGamepad1 = true
EnableGamepad2 = true
# Analog stick deadzone (raw axis units, range 1-32767).
# 3277 ~ 10% deflection. Increase if idle stick drifts trigger movement.
GamepadDeadzone = 3277
# Order: Up, Down, Left, Right, Select, Start, A, B, X, Y, L, R (SNES buttons).
# Names are positional SDL buttons: A = bottom (Switch B), B = right (Switch A),
# X = left (Switch Y), Y = top (Switch X), Lb/Rb = L/R.
# Switch default: dash (SNES A) on R, and SNES R on the Switch A button.
Controls =   DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, Rb, A, Y, X, Lb, B
ControlsP2 = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, Rb, A, Y, X, Lb, B
