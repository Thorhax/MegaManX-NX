format_version = 1
id = "megaman-x.developer.tier2-diagnostics"
version = "1.0.0"
name = "Mega Man X Tier 2 Diagnostics"
author = "mstan"
description = "Writes tier-2 interpreter coverage JSON and JSONL diagnostics for developer promotion work, and netplay connection diagnostics."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "megaman-x-us"
rom_sha256 = "b8f70a6e7fb93819f79693578887e2c11e196bdf1ac6ddc7cb924b1ad0be2d32"

[[feature]]
id = "tier2-diagnostics"
name = "Tier 2 diagnostics"
description = "Add tier2_mmx_*.json and .jsonl coverage files and saves/netplay/net_diag.jsonl connection logs. Replay diagnostics already record by default in logs/mmx-replay-*; include their checkpoint and settings sidecars. Disable run-ahead while recording."
group = "Developer"
default_enabled = false

[[plugin]]
feature = "tier2-diagnostics"
id = "megaman-x.tier2-diagnostics"
